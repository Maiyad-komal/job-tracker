<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Placement Portal | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="auth-card">
        <h1>Student Placement Portal</h1>
        <p>Sign in to continue</p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input id="email" type="text" required placeholder="Enter your email">

            <label for="password">Password</label>
            <input id="password" type="password" required placeholder="Enter your password">

            <button type="submit">Login</button>
            <p id="message"></p>
        </form>

        <p>New student? <a href="register.html">Create an account</a></p>
    </main>
    <script src="config.js"></script>
    <script src="login.js"></script>
</body>
</html>
