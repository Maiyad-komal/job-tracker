<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Placement Portal | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-card">
        <h1>Create Student Account</h1>
        <p>Register to explore placement opportunities.</p>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input id="name" type="text" required placeholder="Enter your full name">

            <label for="email">Email</label>
            <input id="email" type="email" required placeholder="Enter your email">

            <label for="password">Password</label>
            <input id="password" type="password" minlength="8" required placeholder="At least 8 characters">

            <button type="submit">Create Account</button>
            <p id="message"></p>
        </form>

        <p>Already registered? <a href="login.html">Login here</a></p>
    </main>

    <script src="config.js"></script>
    <script src="register.js"></script>
</body>
</html>
